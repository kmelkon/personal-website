<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karam Malkon — Links</title>
  <meta name="description" content="Karam Malkon — Software & AI Engineer. Find me on GitHub, LinkedIn, itch.io, Play Store, and npm.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* ===== RESET & TOKENS ===== */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #fdf6f0;
      --ink: #1a1a1a;
      --card: #fefcfa;
      --card-2: #faf0f0;
      --accent: #cc5f5f;
      --accent-pale: #f5dada;
      --on-accent: #ffffff;
      --muted: #6b6b6b;

      --border: 3.5px solid var(--ink);
      --border-thick: 4.5px solid var(--ink);
      --shadow-offset: 6px 6px 0 var(--ink);
      --font-display: 'Space Mono', monospace;
      --font-body: 'Space Grotesk', sans-serif;
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Dark by system preference (unless user forced light) */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #1b1917;
        --ink: #fdf6f0;
        --card: #262220;
        --card-2: #2e2422;
        --accent: #e0706e;
        --accent-pale: #3a2a29;
        --on-accent: #1b1917;
        --muted: #9a938c;
      }
    }
    /* Dark when user forces it */
    :root[data-theme="dark"] {
      --bg: #1b1917;
      --ink: #fdf6f0;
      --card: #262220;
      --card-2: #2e2422;
      --accent: #e0706e;
      --accent-pale: #3a2a29;
      --on-accent: #1b1917;
      --muted: #9a938c;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--ink);
      overflow-x: hidden;
      min-height: 100vh;
      cursor: default;
      transition: background 0.4s ease, color 0.4s ease;
    }

    ::selection { background: var(--accent); color: var(--on-accent); }
    a { color: inherit; text-decoration: none; }

    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 88px 24px 48px;
      position: relative;
      z-index: 1;
    }

    /* ===== THEME TOGGLE ===== */
    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 200;
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      background: var(--card);
      border: var(--border);
      cursor: pointer;
      color: var(--ink);
      transition: transform 0.3s var(--spring), background 0.3s ease, color 0.3s ease;
    }
    .theme-toggle:hover {
      transform: rotate(-6deg) scale(1.08);
      box-shadow: 4px 4px 0 var(--ink);
    }
    .theme-toggle:active { transform: scale(0.95); }
    .theme-toggle svg { width: 22px; height: 22px; display: none; }
    :root[data-theme="dark"] .theme-toggle .i-sun,
    :root:not([data-theme="light"]) .theme-toggle .i-sun { display: block; }
    :root[data-theme="dark"] .theme-toggle .i-moon,
    :root:not([data-theme="light"]) .theme-toggle .i-moon { display: none; }
    :root[data-theme="light"] .theme-toggle .i-moon { display: block; }
    :root[data-theme="light"] .theme-toggle .i-sun { display: none; }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) .theme-toggle .i-moon { display: block; }
      :root:not([data-theme="dark"]) .theme-toggle .i-sun { display: none; }
    }

    /* ===== HERO ===== */
    .hero { position: relative; margin-bottom: 56px; }

    .avatar {
      width: 84px; height: 84px;
      border: var(--border-thick);
      background: var(--accent);
      color: var(--on-accent);
      display: grid; place-items: center;
      font-family: var(--font-display);
      font-weight: 700; font-size: 2rem;
      letter-spacing: -1px;
      transform: rotate(-3deg);
      margin-bottom: 24px;
      transition: transform 0.4s var(--spring), box-shadow 0.3s ease;
    }
    .avatar:hover {
      transform: rotate(0deg) scale(1.05);
      box-shadow: var(--shadow-offset);
    }

    .hero-label {
      font-family: var(--font-display);
      font-size: 0.8rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 3px;
      color: var(--muted);
      display: inline-block;
      margin-bottom: 14px;
      transform: rotate(-1deg);
    }

    .hero h1 {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(2.6rem, 9vw, 4.2rem);
      line-height: 0.95; letter-spacing: -2px;
      margin-bottom: 22px;
    }
    .hero h1 .last { color: var(--accent); }

    .tagline {
      font-family: var(--font-display);
      font-size: clamp(1rem, 3.4vw, 1.2rem);
      line-height: 1.5;
      max-width: 520px;
      padding: 18px 22px;
      background: var(--card-2);
      border: var(--border);
      transform: rotate(0.8deg);
      transition: transform 0.3s var(--spring);
    }
    .tagline:hover { transform: rotate(0deg) scale(1.02); }

    /* ===== LINKS ===== */
    .links-head {
      font-family: var(--font-display);
      font-size: 0.8rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 3px;
      color: var(--muted);
      margin: 0 0 20px 2px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .card {
      position: relative;
      overflow: hidden;
      border: var(--border-thick);
      background: var(--card);
      padding: 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      opacity: 0;
      transform: translateY(18px);
      transition: transform 0.4s var(--spring), box-shadow 0.35s ease,
                  color 0.35s ease, opacity 0.5s ease;
    }
    .card.in { opacity: 1; transform: translateY(0); }
    .card:nth-child(odd).in  { transform: rotate(-1deg); }
    .card:nth-child(even).in { transform: rotate(1deg); }

    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--accent);
      transform: translateY(101%);
      transition: transform 0.35s var(--spring);
      z-index: 0;
    }
    .card:hover::before { transform: translateY(0); }
    .card:hover {
      transform: rotate(0deg) scale(1.04) !important;
      box-shadow: var(--shadow-offset);
      color: var(--on-accent);
      z-index: 3;
    }

    .card .ico, .card .meta { position: relative; z-index: 1; }
    .card .ico {
      width: 40px; height: 40px;
      flex-shrink: 0;
      display: grid; place-items: center;
    }
    .card .ico svg { width: 34px; height: 34px; }
    .card .name {
      font-family: var(--font-display);
      font-weight: 700; font-size: 1.15rem;
      letter-spacing: -0.5px;
      line-height: 1.1;
    }
    .card .handle {
      font-family: var(--font-display);
      font-size: 0.78rem;
      color: var(--muted);
      transition: color 0.35s ease;
      margin-top: 3px;
      word-break: break-all;
    }
    .card:hover .handle { color: rgba(255,255,255,0.75); }
    :root[data-theme="dark"] .card:hover .handle,
    :root:not([data-theme="light"]) .card:hover .handle {
      color: rgba(27,25,23,0.7);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .card:hover .handle { color: rgba(27,25,23,0.7); }
    }

    .card .arrow {
      position: absolute;
      top: 14px; right: 16px;
      z-index: 1;
      font-family: var(--font-display);
      font-weight: 700; font-size: 1.05rem;
      opacity: 0;
      transform: translate(-4px, 4px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .card:hover .arrow { opacity: 1; transform: translate(0, 0); }

    /* ===== FOOTER ===== */
    footer {
      margin-top: 56px;
      padding-top: 24px;
      border-top: var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    footer p {
      font-family: var(--font-display);
      font-size: 0.78rem; color: var(--muted);
    }
    footer .hint { opacity: 0.7; }
    .dot {
      width: 12px; height: 12px;
      background: var(--accent);
      border: 2px solid var(--ink);
      transform: rotate(45deg);
      transition: transform 0.6s ease;
      flex-shrink: 0;
    }
    .dot:hover { transform: rotate(225deg) scale(1.3); }

    /* ===== FLOATING SHAPES ===== */
    .shape {
      position: fixed;
      z-index: 0;
      cursor: grab;
      user-select: none; -webkit-user-select: none;
      will-change: transform;
      transition: border-radius 0.5s var(--spring), box-shadow 0.3s ease, clip-path 0.5s var(--spring);
    }
    .shape:active { cursor: grabbing; }
    .shape.dragging { cursor: grabbing; box-shadow: 8px 8px 0 var(--ink) !important; z-index: 20; }
    .shape.sq { border-radius: 0; }
    .shape.sq:hover:not(.dragging):not(.phys) { border-radius: 50%; }
    .shape.ci { border-radius: 50%; }
    .shape.ci:hover:not(.dragging):not(.phys) { border-radius: 0; }
    .shape.tr { clip-path: polygon(50% 0, 0 100%, 100% 100%); }
    .shape.di { clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
    .shape.floating { animation: floaty var(--dur, 11s) ease-in-out infinite; animation-delay: var(--del, 0s); }
    .shape.dragging, .shape.phys { animation: none !important; }
    @keyframes floaty {
      0%, 100% { transform: translate(0,0) rotate(var(--rot, 0deg)); }
      25% { transform: translate(10px,-15px) rotate(calc(var(--rot,0deg) + 4deg)); }
      50% { transform: translate(-6px,-25px) rotate(calc(var(--rot,0deg) - 3deg)); }
      75% { transform: translate(12px,-10px) rotate(calc(var(--rot,0deg) + 5deg)); }
    }

    /* ===== CURSOR ===== */
    .cursor-dot {
      position: fixed;
      width: 12px; height: 12px;
      background: var(--accent);
      border: 2px solid var(--ink);
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: transform 0.15s ease, opacity 0.15s ease, background 0.15s ease;
    }
    .cursor-dot.hover {
      transform: translate(-50%, -50%) scale(2.5);
      background: transparent;
    }

    /* ===== TOAST (konami / copy) ===== */
    .toast {
      position: fixed;
      left: 50%; bottom: 26px;
      transform: translateX(-50%) translateY(16px);
      background: var(--ink); color: var(--bg);
      font-family: var(--font-display); font-weight: 700;
      font-size: 0.82rem; letter-spacing: 0.3px;
      padding: 11px 18px;
      border: 3px solid var(--accent);
      opacity: 0; pointer-events: none; z-index: 500;
      transition: opacity 0.25s ease, transform 0.3s var(--spring);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ===== AVATAR SPIN ===== */
    @keyframes spin360 { to { transform: rotate(363deg); } }
    .avatar.spin { animation: spin360 0.6s var(--spring); }

    /* ===== TAGLINE WAVE ===== */
    @keyframes wave {
      0%, 100% { transform: rotate(0.8deg); }
      20% { transform: rotate(-2.5deg); }
      45% { transform: rotate(3deg); }
      70% { transform: rotate(-1.5deg); }
    }
    .tagline.wave { animation: wave 0.8s ease; }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 560px) {
      .grid { grid-template-columns: 1fr; }
      .wrap { padding-top: 76px; }
    }
    @media (max-width: 760px) { .shape { display: none; } }
    @media (pointer: coarse) { .cursor-dot { display: none; } }
    @media (prefers-reduced-motion: reduce) {
      .shape.floating { animation: none; }
      * { scroll-behavior: auto; }
    }
  </style>
</head>

  <script>
    // ===== Theme toggle =====
    (function () {
      const root = document.documentElement;
      const btn = document.getElementById('themeToggle');
      const saved = localStorage.getItem('theme');
      if (saved === 'light' || saved === 'dark') root.setAttribute('data-theme', saved);

      function effective() {
        const attr = root.getAttribute('data-theme');
        if (attr) return attr;
        return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      btn.addEventListener('click', () => {
        const next = effective() === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
      });
    })();

    document.getElementById('year').textContent = new Date().getFullYear();

    // ===== Custom cursor (fine pointers only) =====
    const cursor = document.getElementById('cursor');
    if (matchMedia('(pointer: fine)').matches) {
      let mx = 0, my = 0, cx = 0, cy = 0;
      addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
      (function loop() {
        cx += (mx - cx) * 0.18; cy += (my - cy) * 0.18;
        cursor.style.left = cx + 'px'; cursor.style.top = cy + 'px';
        requestAnimationFrame(loop);
      })();
      document.querySelectorAll('a, button, .card, .tagline, .avatar, .dot, .shape')
        .forEach(el => {
          el.addEventListener('mouseenter', () => cursor.classList.add('hover'));
          el.addEventListener('mouseleave', () => cursor.classList.remove('hover'));
        });
    } else {
      cursor.style.display = 'none';
    }

    // ===== Stagger cards in =====
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          const cards = [...document.querySelectorAll('.card')];
          cards.forEach((c, i) => setTimeout(() => c.classList.add('in'), i * 90));
          io.disconnect();
        }
      });
    }, { threshold: 0.1 });
    io.observe(document.getElementById('grid'));

    // ===== Floating shapes: drag, throw, gravity (G) + play features =====
    (function () {
      if (matchMedia('(max-width: 760px)').matches) return;
      const all = [];
      let gravity = false, frame = null, last = 0;
      const BOUNCE = 0.55, FRICTION = 0.985, STOP = 8, G = 1800;

      function pin(s) {
        if (s.moved) return;
        const rr = s.el.getBoundingClientRect();
        s.x = rr.left; s.y = rr.top;
        s.el.classList.remove('floating');
        s.el.style.left = '0'; s.el.style.top = '0';
        s.el.style.right = 'auto'; s.el.style.bottom = 'auto';
        s.moved = true;
      }

      function register(el) {
        const r = el.getBoundingClientRect();
        const s = {
          el, dragging: false, phys: false, moved: false, dead: false,
          x: r.left, y: r.top, w: el.offsetWidth, h: el.offsetHeight,
          vx: 0, vy: 0, sx: 0, sy: 0, ex: 0, ey: 0, hist: []
        };
        el._s = s; all.push(s);

        el.addEventListener('mousedown', e => {
          e.preventDefault(); e.stopPropagation();
          const rr = el.getBoundingClientRect();
          s.x = rr.left; s.y = rr.top;
          el.classList.remove('floating', 'phys');
          el.classList.add('dragging');
          el.style.left = '0'; el.style.top = '0';
          el.style.right = 'auto'; el.style.bottom = 'auto';
          el.style.transform = `translate(${s.x}px,${s.y}px)`;
          s.dragging = true; s.moved = true;
          s.sx = e.clientX; s.sy = e.clientY; s.ex = s.x; s.ey = s.y;
          s.hist = [{ x: e.clientX, y: e.clientY, t: performance.now() }];
          s.vx = 0; s.vy = 0;
        });

        // E2 — double-click to kick it flying
        el.addEventListener('dblclick', e => {
          e.preventDefault();
          pin(s);
          const ang = Math.random() * Math.PI * 2, pow = 1300 + Math.random() * 900;
          s.vx = Math.cos(ang) * pow; s.vy = Math.sin(ang) * pow;
          el.classList.remove('floating'); el.classList.add('phys');
          s.phys = true; ensure();
        });

        return s;
      }

      // Spawn a fresh accent shape flying from (x,y); temp ones fade + clean up
      function spawn(x, y, vx, vy, temp) {
        const kinds = ['sq', 'ci', 'tr', 'di'];
        const size = 26 + (Math.random() * 34 | 0);
        const el = document.createElement('div');
        el.className = 'shape ' + kinds[(Math.random() * 4) | 0];
        el.style.cssText = `width:${size}px;height:${size}px;background:var(--accent);opacity:.85;left:0;top:0;right:auto;bottom:auto;transform:translate(${x}px,${y}px)`;
        document.body.appendChild(el);
        const s = register(el);
        s.x = x; s.y = y; s.w = size; s.h = size;
        s.moved = true; s.phys = true; s.vx = vx; s.vy = vy;
        el.classList.add('phys');
        if (temp) setTimeout(() => {
          el.style.transition = 'opacity .6s ease'; el.style.opacity = '0';
          setTimeout(() => {
            s.dead = true; el.remove();
            const i = all.indexOf(s); if (i >= 0) all.splice(i, 1);
          }, 650);
        }, 3500);
        return s;
      }

      document.querySelectorAll('.shape').forEach(register);

      addEventListener('mousemove', e => {
        for (const s of all) {
          if (!s.dragging) continue;
          s.x = s.ex + (e.clientX - s.sx);
          s.y = s.ey + (e.clientY - s.sy);
          s.el.style.transform = `translate(${s.x}px,${s.y}px)`;
          const now = performance.now();
          s.hist.push({ x: e.clientX, y: e.clientY, t: now });
          while (s.hist.length > 1 && now - s.hist[0].t > 80) s.hist.shift();
        }
      });

      addEventListener('mouseup', () => {
        for (const s of all) {
          if (!s.dragging) continue;
          s.dragging = false;
          s.el.classList.remove('dragging');
          cursor.classList.remove('hover');
          const h = s.hist;
          if (h.length >= 2) {
            const a = h[0], b = h[h.length - 1], dt = (b.t - a.t) / 1000;
            if (dt > 0.005) {
              s.vx = (b.x - a.x) / dt; s.vy = (b.y - a.y) / dt;
              const max = 2500, sp = Math.hypot(s.vx, s.vy);
              if (sp > max) { s.vx = s.vx / sp * max; s.vy = s.vy / sp * max; }
            }
          }
          s.el.classList.add('phys'); s.phys = true; ensure();
        }
      });

      function ensure() { if (!frame) { last = performance.now(); frame = requestAnimationFrame(step); } }

      // E5 — shapes bump into each other (circle approximation)
      function collide() {
        for (let i = 0; i < all.length; i++) {
          const a = all[i]; if (a.dead || !a.moved) continue;
          for (let j = i + 1; j < all.length; j++) {
            const b = all[j]; if (b.dead || !b.moved) continue;
            const ar = Math.min(a.w, a.h) / 2, br = Math.min(b.w, b.h) / 2;
            const dx = (b.x + b.w / 2) - (a.x + a.w / 2);
            const dy = (b.y + b.h / 2) - (a.y + a.h / 2);
            const dist = Math.hypot(dx, dy) || 0.001, min = ar + br;
            if (dist < min) {
              const nx = dx / dist, ny = dy / dist, push = (min - dist) / 2;
              a.x -= nx * push; a.y -= ny * push;
              b.x += nx * push; b.y += ny * push;
              const vn = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
              if (vn < 0) {
                const imp = -1.4 * vn / 2;
                a.vx -= imp * nx; a.vy -= imp * ny;
                b.vx += imp * nx; b.vy += imp * ny;
              }
            }
          }
        }
      }

      function step(now) {
        const dt = Math.min((now - last) / 1000, 0.05); last = now;
        const W = innerWidth, H = innerHeight;
        let active = false;

        for (const s of all) {
          if (s.dead || s.dragging) continue;
          if (!s.phys && !gravity) continue;
          if (gravity && !s.phys) { pin(s); s.phys = true; s.el.classList.add('phys'); }
          active = true;
          if (gravity) s.vy += G * dt;
          s.vx *= FRICTION; s.vy *= FRICTION;
          s.x += s.vx * dt; s.y += s.vy * dt;
          const mx = W - s.w, my = H - s.h;
          if (s.x < 0) { s.x = 0; s.vx = Math.abs(s.vx) * BOUNCE; }
          else if (s.x > mx) { s.x = mx; s.vx = -Math.abs(s.vx) * BOUNCE; }
          if (s.y < 0) { s.y = 0; s.vy = Math.abs(s.vy) * BOUNCE; }
          else if (s.y > my) { s.y = my; s.vy = -Math.abs(s.vy) * BOUNCE; }
        }

        collide();

        for (const s of all) {
          if (s.dead || s.dragging) continue;
          if (!s.phys && !gravity) continue;
          const mx = W - s.w, my = H - s.h;
          if (s.x < 0) s.x = 0; else if (s.x > mx) s.x = mx;
          if (s.y < 0) s.y = 0; else if (s.y > my) s.y = my;
          s.el.style.transform = `translate(${s.x}px,${s.y}px) rotate(${s.vx * 0.03}deg)`;
          const sp = Math.hypot(s.vx, s.vy);
          if (!gravity && sp < STOP) {
            s.vx = s.vy = 0; s.phys = false; s.el.classList.remove('phys');
            s.el.style.transform = `translate(${s.x}px,${s.y}px)`;
          }
          if (gravity && s.y >= my - 1 && sp < STOP) { s.vx = s.vy = 0; }
        }

        frame = (active || gravity) ? requestAnimationFrame(step) : null;
      }

      // Gravity toggle
      addEventListener('keydown', e => {
        if (/input|textarea/i.test(e.target.tagName)) return;
        if (e.key === 'g' || e.key === 'G') { gravity = !gravity; if (gravity) ensure(); }
      });

      // E6 — click the avatar: spin + fling a shape
      const avatar = document.querySelector('.avatar');
      if (avatar) {
        avatar.style.cursor = 'pointer';
        avatar.addEventListener('click', () => {
          avatar.classList.remove('spin'); void avatar.offsetWidth; avatar.classList.add('spin');
          const r = avatar.getBoundingClientRect();
          spawn(r.left + r.width / 2, r.top + r.height / 2,
                (Math.random() - 0.5) * 900, -650 - Math.random() * 500, true);
          ensure();
        });
      }

      // E1 — Konami code: shape burst
      const KON = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
      let ki = 0;
      addEventListener('keydown', e => {
        const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
        ki = (k === KON[ki]) ? ki + 1 : (k === KON[0] ? 1 : 0);
        if (ki === KON.length) {
          ki = 0;
          const cx = innerWidth / 2, cy = innerHeight / 2;
          for (let n = 0; n < 16; n++) {
            const ang = (Math.PI * 2 * n) / 16 + Math.random() * 0.3, pow = 900 + Math.random() * 700;
            spawn(cx, cy, Math.cos(ang) * pow, Math.sin(ang) * pow, true);
          }
          ensure();
          showToast('🎉 you found it');
        }
      });
    })();

    // Shared toast (konami + copy)
    let _toastT;
    function showToast(msg) {
      let t = document.getElementById('toast');
      if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; document.body.appendChild(t); }
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(_toastT);
      _toastT = setTimeout(() => t.classList.remove('show'), 1600);
    }

    // E3 — click the email card to copy the address
    (function () {
      const card = document.querySelector('a[href^="mailto:"]');
      if (!card) return;
      const addr = card.getAttribute('href').replace('mailto:', '');
      card.addEventListener('click', async e => {
        if (navigator.clipboard && window.isSecureContext) {
          e.preventDefault();
          try { await navigator.clipboard.writeText(addr); showToast('Email copied ✓'); }
          catch { location.href = 'mailto:' + addr; }
        }
      });
    })();

    // E4 — type "hi" anywhere: the tagline waves back
    (function () {
      const tagline = document.querySelector('.tagline');
      if (!tagline) return;
      let buf = '';
      addEventListener('keydown', e => {
        if (/input|textarea/i.test(e.target.tagName) || e.key.length !== 1) return;
        buf = (buf + e.key.toLowerCase()).slice(-4);
        if (buf.endsWith('hi')) {
          tagline.classList.remove('wave'); void tagline.offsetWidth; tagline.classList.add('wave');
          showToast('👋 hey!'); buf = '';
        }
      });
    })();
  </script>
</body>
</html>
